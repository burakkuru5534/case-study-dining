services:
  postgres:
    # Pinned to 16 to match local client tools: pg_dump refuses to dump a newer server major.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # local development only
      POSTGRES_DB: dining
    ports:
      # Host port 55432 avoids clashing with native PostgreSQL installs (5432/5433).
      # Bound to loopback so the dev database is not reachable from the LAN.
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dining"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: local
      HTTP_PORT: "8080"
      # Service name and container port: 55432 only exists on the host.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/dining?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # Must exceed the app's shutdownTimeout (10s), otherwise Docker's SIGKILL
    # can cut graceful shutdown short.
    stop_grace_period: 15s

volumes:
  postgres-data:
